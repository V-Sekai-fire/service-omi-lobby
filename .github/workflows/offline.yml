# Uro and the VictoriaMetrics suite, each in its own bubblewrap sandbox on a
# private internal network with no route out: the runtime half of the offline deploy (#76).
# Building still fetches.
name: Offline

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: offline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  offline:
    name: offline
    runs-on: ubuntu-24.04

    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17"
          otp-version: "27"

      - name: Cache Mix deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-zone-backend-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-zone-backend-mix-

      - name: Install bubblewrap
        run: |
          sudo apt-get install -y -q bubblewrap
          # Ubuntu 24.04 confines unprivileged user namespaces, which bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Fetch and compile (online, the build half)
        run: |
          mix deps.get
          mix compile

      - name: Fetch the VictoriaMetrics suite, pinned by sha256 (online, the build half)
        run: |
          mkdir -p victoria
          while read -r sha url; do
            curl -fsSL -o victoria/pkg.tar.gz "$url"
            echo "$sha  victoria/pkg.tar.gz" | sha256sum -c -
            tar -xzf victoria/pkg.tar.gz -C victoria
          done <<'EOF'
          1b495bde563825cf83dc7c0425a9d8fa03e7214858e0949f9177efc6bb1f8bfc https://github.com/VictoriaMetrics/VictoriaMetrics/releases/download/v1.153.0/victoria-metrics-linux-amd64-v1.153.0.tar.gz
          8ad858111778b211a98729dca1bd640edbd06c4d5b2acece8e040be0c1aa5a83 https://github.com/VictoriaMetrics/VictoriaLogs/releases/download/v1.51.1/victoria-logs-linux-amd64-v1.51.1.tar.gz
          67be031fb00635929b2d02a6e2ce7e5ebc8b2929f8e0d79fb54ab48bff0ca966 https://github.com/VictoriaMetrics/VictoriaTraces/releases/download/v0.12.0/victoria-traces-linux-amd64-v0.12.0.tar.gz
          EOF
          rm victoria/pkg.tar.gz
          ls -l victoria

      - name: Run Uro and the VictoriaMetrics suite on the private network
        run: tools/offline/run.sh

      - name: Control (the same sandbox refuses a fetch past the machine)
        run: |
          if bwrap --unshare-net --ro-bind / / --dev /dev --proc /proc \
               curl -sS --max-time 5 -o /dev/null https://github.com 2> control.txt; then
            echo "github.com answered with the network unshared"; exit 1
          fi
          cat control.txt
          # Outside the sandbox the same fetch works, so the failure above is the sandbox's.
          curl -sS --max-time 15 -o /dev/null https://github.com

# OMI Lobby API (Uro). Private: no public IPs, reached over Flycast by the web app only.
#   fly deploy --config fly/api/fly.toml --no-public-ips
app = "vsekai-lobby-api"
primary_region = "sjc"

[build]
  dockerfile = "Containerfile"

[env]
  URO_DATABASE = "/data/vsekai-lobby.db"

# One volume, so run one machine:
#   fly volumes create vsekai_lobby_data --app vsekai-lobby-api --region sjc --size 1
[mounts]
  source = "vsekai_lobby_data"
  destination = "/data"

[[services]]
  internal_port = 4000
  protocol = "tcp"
  auto_stop_machines = "off"
  min_machines_running = 1
  [[services.ports]]
    port = 80
    handlers = ["http"]

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
